name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            extra: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - os: windows-latest
            name: Windows
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DORACLEE_INSTALL_PLUGINS=OFF "${{ matrix.extra }}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/Oraclee_artefacts/Release/VST3/* dist/ 2>/dev/null || true
          cp -R build/Oraclee_artefacts/Release/AU/* dist/ 2>/dev/null || true
          cp -R build/Oraclee_artefacts/Release/Standalone/* dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: oraclee-${{ matrix.name }}
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qry "../${d%/}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
